<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PianoPilot mini</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317121F'/%3E%3Crect x='6' y='7' width='6' height='18' rx='1.5' fill='%23EEE6D3'/%3E%3Crect x='13' y='7' width='6' height='18' rx='1.5' fill='%23EEE6D3'/%3E%3Crect x='20' y='7' width='6' height='18' rx='1.5' fill='%23EEE6D3'/%3E%3Crect x='10' y='7' width='4' height='11' rx='1' fill='%23D3A54A'/%3E%3Crect x='17.5' y='7' width='4' height='11' rx='1' fill='%23D3A54A'/%3E%3C/svg%3E">
<style>
@font-face { font-family: "Instrument Sans"; src: url("/fonts/InstrumentSans.ttf") format("truetype"); font-weight: 400 700; }
@font-face { font-family: "Instrument Serif"; src: url("/fonts/InstrumentSerif.ttf") format("truetype"); }
:root { --bg: #17121F; --raised: #2A2236; --line: #3A3048; --well: #120E18; --ivory: #EEE6D3; --ivory-2: #BDB3A3;
  --quiet: #918799; --brass: #D3A54A; --brass-hi: #E6BE68; --brass-ink: #241A0A; --rose: #E08A8A; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ivory); font: 14px/1.35 "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.top { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.title { font: 400 21px/1.15 "Instrument Serif", Georgia, serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.full { background: none; border: 0; color: var(--quiet); font-size: 12px; padding: 2px 4px; border-radius: 6px; white-space: nowrap; }
.full:hover { color: var(--ivory); }
.status { color: var(--ivory-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }
.status.live { color: var(--brass-hi); }
.status.bad { color: var(--rose); }
.bar { position: relative; height: 18px; cursor: pointer; }
.bar .track { position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--line); }
.bar .fill { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--brass); width: 0; }
.bar .knob { position: absolute; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--ivory); margin-left: -6px; left: 0; }
.times { display: flex; justify-content: space-between; color: var(--quiet); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: -6px; }
.row { display: flex; align-items: center; gap: 8px; }
.play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--brass); color: var(--brass-ink); display: grid; place-items: center; }
.play:hover { background: var(--brass-hi); }
.b { height: 34px; min-width: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); display: grid; place-items: center; }
.b:hover { background: #352B43; }
.b:disabled { opacity: .4; cursor: default; }
.speed { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.speed output { min-width: 46px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-token="__TOKEN__">
<div class="top"><div class="title" id="title">Nothing selected</div><button class="full" id="full" title="Open the full PianoPilot window">Full window</button></div>
<div class="status" id="status" role="status">Pick a song in the full window.</div>
<div class="bar" id="bar" role="slider" tabindex="0" aria-label="Song position"><div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
<div class="times"><span id="tNow">0:00</span><span id="tTotal">0:00</span></div>
<div class="row">
  <button class="play" id="play" aria-label="Play"></button>
  <button class="b" id="stop" aria-label="Stop" title="Stop"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
  <button class="b" id="restart" aria-label="Back to the start" title="Back to the start"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg></button>
  <button class="b" id="next" aria-label="Next song in the queue" title="Next song in the queue"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg></button>
  <div class="speed"><button class="b" id="slower" aria-label="Slower" title="Slower">−</button><output id="speed">1.00×</output><button class="b" id="faster" aria-label="Faster" title="Faster">+</button></div>
</div>
<script>
"use strict";
const TOKEN = document.body.dataset.token;
const $ = s => document.querySelector(s);
const ACTIVE = new Set(["waiting", "countdown", "playing", "paused"]);
let status = { state: "idle", pos: 0, total: 0 }, statusAt = 0, songs = new Map(), queue = [], speeds = {}, selected = null;
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "X-PianoPilot": TOKEN, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error || "Request failed");
  return d;
}
const act = action => api("POST", "/api/hotkey", { action }).catch(e => { $("#status").textContent = e.message; $("#status").className = "status bad"; });
async function loadSongs() {
  try { const d = await api("GET", "/api/library"); songs = new Map(d.songs.map(s => [s.key, s])); selected = d.selected || d.last_song || selected; render(); } catch (e) { /* app closed */ }
}
async function loadSpeed(key) {
  if (!key) return;
  try { const d = await api("GET", `/api/song?key=${encodeURIComponent(key)}`); speeds[key] = d.settings.speed; render(); } catch (e) { /* gone */ }
}
function pos() {
  let p = status.pos || 0;
  if (status.state === "playing") p += (performance.now() - statusAt) / 1000 * (speeds[status.key] || 1);
  return Math.min(p, status.total || p);
}
function render() {
  const key = ACTIVE.has(status.state) ? status.key : (selected || status.key);
  const song = songs.get(key);
  $("#title").textContent = song ? song.title : "Nothing selected";
  const st = $("#status");
  const map = { waiting: "Click into Roblox to start", countdown: `Starting in ${status.count}`, playing: "Playing", finished: "Finished", stopped: "Stopped", error: status.reason || "Stopped by an error" };
  let text = status.state === "paused" ? (status.reason === "focus" ? "Paused until you click into Roblox" : status.reason === "resuming" ? "Resuming…" : "Paused")
    : (map[status.state] || (song ? "Ready" : "Pick a song in the full window"));
  if (queue.length) { const nx = songs.get(queue[0]); text += `. Up next: ${nx ? nx.title : queue[0]}`; }
  st.textContent = text; st.className = "status" + (status.state === "playing" ? " live" : status.state === "error" ? " bad" : "");
  const here = ACTIVE.has(status.state);
  const resume = here && status.state === "paused" && status.reason === "manual";
  const mode = !here ? "Play" : resume ? "Resume" : "Pause";
  $("#play").innerHTML = mode === "Pause" ? `<svg width="20" height="20" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>`
    : `<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>`;
  $("#play").setAttribute("aria-label", mode); $("#play").title = mode;
  $("#stop").disabled = !here; $("#next").disabled = !queue.length && !status.next_auto;
  $("#speed").textContent = `${(speeds[key] || 1).toFixed(2)}×`;
  if (key && speeds[key] === undefined) { speeds[key] = 1; loadSpeed(key); }
  draw();
}
function draw() {
  const total = status.total || (songs.get(status.key || selected) || {}).duration || 0;
  const p = ACTIVE.has(status.state) ? pos() : (status.state === "finished" ? 0 : status.pos || 0);
  const frac = total ? Math.min(1, p / total) : 0;
  $("#fill").style.width = `${frac * 100}%`; $("#knob").style.left = `${frac * 100}%`;
  $("#tNow").textContent = fmt(p); $("#tTotal").textContent = fmt(total);
}
// The bar moves 10 times a second while a song plays and rests otherwise (this window sits beside Roblox,
// so it shouldn't take frames from it).
let ticker = null;
function keepTicking() {
  if (status.state === "playing" && !ticker) ticker = setInterval(draw, 100);
  else if (status.state !== "playing" && ticker) { clearInterval(ticker); ticker = null; }
}
const es = new EventSource(`/api/events?token=${encodeURIComponent(TOKEN)}`);
es.addEventListener("hello", e => { const d = JSON.parse(e.data); status = d.status; statusAt = performance.now(); queue = d.queue || []; loadSongs(); keepTicking(); });
es.addEventListener("status", e => { status = JSON.parse(e.data); statusAt = performance.now(); render(); keepTicking(); });
es.addEventListener("queue", e => { queue = JSON.parse(e.data).items; render(); });
es.addEventListener("library", () => loadSongs());
es.addEventListener("song-settings", e => { const d = JSON.parse(e.data); speeds[d.key] = d.settings.speed; render(); });
es.addEventListener("reset", () => { speeds = {}; render(); });
es.onerror = () => { $("#status").textContent = "PianoPilot isn't running."; $("#status").className = "status bad"; };
$("#play").addEventListener("click", () => act("play_pause"));
$("#stop").addEventListener("click", () => act("stop"));
$("#restart").addEventListener("click", () => act("restart"));
$("#next").addEventListener("click", () => act("next"));
$("#slower").addEventListener("click", () => act("slower"));
$("#faster").addEventListener("click", () => act("faster"));
$("#full").addEventListener("click", () => api("POST", "/api/focus-main").catch(() => {}));
$("#bar").addEventListener("click", e => {
  if (!ACTIVE.has(status.state)) return;
  const r = $("#bar").getBoundingClientRect(), frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const target = frac * (status.total || 0);
  status.pos = target; statusAt = performance.now(); draw();
  api("POST", "/api/seek", { pos: target }).catch(() => {});
});
// Hotkeys while the mini player is in front (the global ones only listen while Roblox is in front).
let hotkeys = {};
const KEY_NAMES = { Home: "HOME", End: "END", Insert: "INSERT", Delete: "DELETE", PageUp: "PAGEUP", PageDown: "PAGEDOWN", Pause: "PAUSE", ScrollLock: "SCROLLLOCK" };
const loadHotkeys = () => api("GET", "/api/app-settings").then(d => { hotkeys = d.player.hotkeys || {}; }).catch(() => {});
loadHotkeys();
window.addEventListener("focus", loadHotkeys);
es.addEventListener("reset", loadHotkeys);
window.addEventListener("keydown", e => {
  if (e.repeat || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
  const name = /^F([1-9]|1[0-2])$/.test(e.key) ? e.key : KEY_NAMES[e.key];
  const action = name && Object.keys(hotkeys).find(a => hotkeys[a] === name);
  if (!action) return;
  e.preventDefault();
  act(action);
});
setInterval(() => { if (!ACTIVE.has(status.state)) api("GET", "/api/library").then(d => { const k = d.selected || d.last_song; if (k !== selected) { selected = k; render(); } }).catch(() => {}); }, 3000);
render();
</script>
</body>
</html>
